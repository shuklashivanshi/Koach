# Koach — Cloud Build deploy pipeline.
#
# Checks, builds and deploys the backend to Cloud Run (asia-south1):
#   - koach-migrate   Cloud Run job: applies DB migrations before every API deploy
#   - koach-api       Cloud Run service (Fastify / TypeScript)
# Later phases add jobs here: koach-rebalance (Phase 4), koach-ca-ingest (Phase 5),
# koach-predict (Phase 8). The mobile app ships separately via EAS Build.
#
# Manual:  gcloud builds submit --config deploy.yaml \
#            --substitutions=_ENV=dev,SHORT_SHA=$(git rev-parse --short HEAD)
# Trigger: infra/trigger.sh creates "koach-<env>-main" (push to main → this file).
# Every resource referenced here is created by infra/bootstrap.sh.

substitutions:
  _ENV: dev
  _REGION: asia-south1
  _AR_REPO: koach
  _SQL_INSTANCE: koach-pg
  _APP_ENV: dev
  # Dev only: also log sign-in codes (the API refuses this when APP_ENV=prod).
  _EMAIL_DEV_ECHO: '1'
  # Reviewers for the knowledge-base admin page (KB-07); use ^:^ as the list separator in triggers.
  _ADMIN_EMAILS: shivanshishukla16@gmail.com

serviceAccount: projects/$PROJECT_ID/serviceAccounts/koach-build@$PROJECT_ID.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true
  # _ENV is informational (set by triggers); allow substitutions the steps do not reference.
  substitutionOption: ALLOW_LOOSE

steps:
  # 1. Install the workspace (pnpm monorepo, Node 24)
  - id: install
    name: node:24
    entrypoint: bash
    args:
      - -c
      - npm install -g pnpm@12.15.0 >/dev/null && pnpm install --frozen-lockfile

  # 2. Quality gates: typecheck, lint, unit + app tests, shell lint, AI evals (mock)
  - id: verify
    name: node:24
    entrypoint: bash
    waitFor: [install]
    args:
      - -c
      - |
        set -euo pipefail
        npm install -g pnpm@12.15.0 >/dev/null
        pnpm -r typecheck
        pnpm lint
        pnpm lint:sh
        pnpm test
        pnpm --filter @koach/ai eval

  # 3. Build container images (Dockerfiles build from the repo root)
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor: [verify]
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-api:$SHORT_SHA
      - .

  - id: build-jobs
    name: gcr.io/cloud-builders/docker
    waitFor: [verify]
    args:
      - build
      - -f
      - apps/jobs/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-jobs:$SHORT_SHA
      - .

  # 4. Push images to Artifact Registry
  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor: [build-api]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-api:$SHORT_SHA"]

  - id: push-jobs
    name: gcr.io/cloud-builders/docker
    waitFor: [build-jobs]
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-jobs:$SHORT_SHA"]

  # 5. Run DB migrations as a Cloud Run job (fails the build on error)
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-jobs]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud run jobs deploy koach-migrate \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-jobs:$SHORT_SHA \
          --region=${_REGION} \
          --service-account=koach-jobs@$PROJECT_ID.iam.gserviceaccount.com \
          --set-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE} \
          --set-secrets=DATABASE_URL=DATABASE_URL:latest \
          --command=node --args=dist/migrate.js \
          --max-retries=0 --task-timeout=600s
        gcloud run jobs execute koach-migrate --region=${_REGION} --wait

  # 6. Deploy the API service
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [push-api, migrate]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - koach-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --service-account=koach-api@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}
      - --set-env-vars=APP_ENV=${_APP_ENV},EMAIL_DEV_ECHO=${_EMAIL_DEV_ECHO},GCP_PROJECT=$PROJECT_ID,GCS_BUCKET=$PROJECT_ID-user-data,ADMIN_EMAILS=${_ADMIN_EMAILS}
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,RESEND_API_KEY=RESEND_API_KEY:latest
      - --allow-unauthenticated # public HTTPS; every route except /health and email sign-in verifies a Firebase ID token
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=1Gi
      - --concurrency=80
      - --timeout=300

  # 7. Smoke test the deployed API
  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    waitFor: [deploy-api]
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL=$$(gcloud run services describe koach-api --region=${_REGION} --format='value(status.url)')
        curl -fsS "$$URL/health"
        test "$$(curl -s -o /dev/null -w '%{http_code}' "$$URL/v1/me")" = "401"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/koach-jobs:$SHORT_SHA

timeout: 2400s
